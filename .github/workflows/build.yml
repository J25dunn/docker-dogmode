name: build

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dogofbitcoin/bitcoin
  # One tag per packaging revision. Builds of this commit reproduce the same program sums (three builds compared,
  # 2026-09-14), but the image digest changes with build times, so republishing a tag hands anyone who pinned it a
  # different image: 31.1-dogmode-7503240 was published twice on 2026-09-05 that way. r2 is the same programs with
  # their license files. This workflow still publishes on every push to main; until it publishes from git tags only,
  # a change that must not republish is pushed with [skip ci] in its commit message.
  TAG: 31.1-dogmode-7503240-r2
  DOGMODE_COMMIT: 75032400914250c7ad857dc29043761680a66485

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          build-args: |
            DOGMODE_COMMIT=${{ env.DOGMODE_COMMIT }}
      - name: what was built
        run: |
          docker pull "$IMAGE:$TAG-${{ matrix.arch }}" >/dev/null
          docker run --rm "$IMAGE:$TAG-${{ matrix.arch }}" --version | head -1
          docker run --rm --entrypoint cat "$IMAGE:$TAG-${{ matrix.arch }}" /SHA256SUMS

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: one tag for both architectures
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          echo "== manifest list (pin this digest in the Umbrel package) =="
          docker buildx imagetools inspect "$IMAGE:$TAG"
